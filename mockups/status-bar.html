<!DOCTYPE html>
<!--
  ⚠️ KIOSK-V2 MOCKUP — TAILWIND ONLY RULE ️

  This mockup uses ONLY Tailwind utility classes. No inline styles with var(--dt-*).
  When implementing in React:
  - All styling must use Tailwind utility classes (bg-bg, text-text-primary, etc.)
  - No inline style="..." with CSS custom properties
  - No const styles objects
  - No CSS Modules or styled-components
  - Dark mode via Tailwind's `dark:` variant (`.dark` class on <html>)
  - Design tokens consumed via @theme block in src/index.css
  See AGENTS.md section 5b for full rules.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashy v2 — Status Bar Detail</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', system-ui, sans-serif;
            --color-primary: var(--dt-primary);
            --color-primary-hover: var(--dt-primary-hover);
            --color-primary-light: var(--dt-primary-light);
            --color-primary-light-hover: var(--dt-primary-light-hover);
            --color-primary-ring: var(--dt-primary-ring);
            --color-bg: var(--dt-bg);
            --color-bg-hover: var(--dt-bg-hover);
            --color-white: var(--dt-white);
            --color-text-primary: var(--dt-text-primary);
            --color-text-secondary: var(--dt-text-secondary);
            --color-text-muted: var(--dt-text-muted);
            --color-text-faint: var(--dt-text-faint);
            --color-text-disabled: var(--dt-text-disabled);
            --color-border: var(--dt-border);
            --color-border-light: var(--dt-border-light);
            --color-border-dark: var(--dt-border-dark);
        }

        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="tokens.css">
</head>
<body class="bg-bg text-text-primary font-sans h-screen overflow-hidden flex flex-col">

    <!-- STATUS BAR — always visible for mockup review (no auto-hide) -->
    <footer class="absolute bottom-0 left-0 right-0 z-50 bg-white border-t border-border shadow-sm h-12">
        <div class="flex items-center justify-between px-4 py-2 h-full">

            <!-- Left: Settings -->
            <button class="p-2 text-text-secondary hover:text-text-primary hover:bg-bg-hover rounded-md transition-colors" title="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>

            <!-- Center: Calendar Feature Only — [Calendar Refresh Timer, Weather Refresh Timer]
                 Hidden when Chores feature is active (activeFeature !== 'calendar') -->
            <div class="flex items-center gap-4 text-sm text-text-muted">
                <!-- Calendar refresh countdown -->
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>2:34</span>
                </div>
                <!-- Weather refresh countdown -->
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
                    </svg>
                    <span>14:22</span>
                </div>
            </div>

            <!-- Center: Chores Feature (hidden by default, shown when activeFeature === 'chores')
                 Empty — no status bar content needed for Chores feature -->
            <!--
            <div class="flex items-center gap-4 text-sm text-text-muted">
                <span>Chores feature active — no status bar timers</span>
            </div>
            -->

            <!-- Right: Theme Toggle Icon (cycles: auto → light → dark) -->
            <button id="theme-toggle" class="p-2 text-text-muted hover:text-text-primary hover:bg-bg-hover rounded-md transition-colors" title="Theme: Auto">
                <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg id="icon-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <svg id="icon-auto" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
            </button>

        </div>
    </footer>

    <!-- Content area placeholder (standardized content card pattern) -->
    <main class="flex-1 flex flex-col p-2 bg-bg">
        <div class="grow rounded-lg bg-white shadow-xs ring-1 ring-border overflow-hidden flex flex-col items-center justify-center">
            <h1 class="text-xl font-semibold text-text-primary mb-1">Status Bar</h1>
            <p class="text-sm text-text-muted">Left: Settings · Center: Calendar Refresh Timers · Right: Theme Toggle</p>
            <p class="text-xs text-text-faint mt-3">Theme toggle cycles: auto → light → dark</p>
        </div>
    </main>

    <script>
        let currentTheme = 'auto';

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        function toggleTheme() {
            const themes = ['auto', 'light', 'dark'];
            const currentIndex = themes.indexOf(currentTheme);
            currentTheme = themes[(currentIndex + 1) % themes.length];

            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');
            const iconAuto = document.getElementById('icon-auto');

            iconSun.classList.add('hidden');
            iconMoon.classList.add('hidden');
            iconAuto.classList.add('hidden');

            if (currentTheme === 'light') {
                html.classList.remove('dark');
                iconSun.classList.remove('hidden');
            } else if (currentTheme === 'dark') {
                html.classList.add('dark');
                iconMoon.classList.remove('hidden');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
                iconAuto.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
