<!DOCTYPE html>
<!--
  ️ KIOSK-V2 MOCKUP — TAILWIND ONLY RULE ⚠️

  This mockup uses ONLY Tailwind utility classes. No inline styles with var(--dt-*).
  When implementing in React:
  - All styling must use Tailwind utility classes (bg-bg, text-text-primary, etc.)
  - No inline style="..." with CSS custom properties
  - No const styles objects
  - No CSS Modules or styled-components
  - Dark mode via Tailwind's `dark:` variant (`.dark` class on <html>)
  - Design tokens consumed via @theme block in src/index.css
  See AGENTS.md section 5b for full rules.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashy v2 — Date Picker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', system-ui, sans-serif;
            --color-primary: var(--dt-primary);
            --color-primary-hover: var(--dt-primary-hover);
            --color-primary-light: var(--dt-primary-light);
            --color-primary-light-hover: var(--dt-primary-light-hover);
            --color-primary-ring: var(--dt-primary-ring);
            --color-bg: var(--dt-bg);
            --color-bg-hover: var(--dt-bg-hover);
            --color-white: var(--dt-white);
            --color-text-primary: var(--dt-text-primary);
            --color-text-secondary: var(--dt-text-secondary);
            --color-text-muted: var(--dt-text-muted);
            --color-text-faint: var(--dt-text-faint);
            --color-text-disabled: var(--dt-text-disabled);
            --color-border: var(--dt-border);
            --color-border-light: var(--dt-border-light);
            --color-border-dark: var(--dt-border-dark);
            --color-success: var(--dt-success);
            --color-danger: var(--dt-danger);
            --color-warning: var(--dt-warning);
            --color-faiyaz: var(--dt-member-faiyaz);
            --color-trisha: var(--dt-member-trisha);
            --color-arya: var(--dt-member-arya);
            --color-raya: var(--dt-member-raya);
        }

        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="tokens.css">
</head>
<body class="bg-bg text-text-primary font-sans h-screen overflow-hidden">

    <!-- Theme toggle (bottom-right) -->
    <button id="theme-toggle" class="fixed bottom-4 right-4 z-[9999] p-2 bg-white text-text-secondary border border-border rounded-lg cursor-pointer hover:bg-bg-hover hover:text-text-primary"
            onclick="toggleTheme()"
            title="Toggle theme">
        <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="icon-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg id="icon-auto" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
    </button>

    <!-- HEADER (context — shows where date picker is triggered from) -->
    <header class="absolute top-0 left-0 right-0 z-50 bg-white border-b border-border shadow-sm h-16">
        <div class="flex items-center justify-between h-full px-4">
            <!-- LEFT: Date + Clock -->
            <div class="flex items-center gap-4">
                <div class="flex flex-col leading-tight">
                    <span class="text-base font-semibold text-text-primary">Wed, Aug 20th</span>
                    <span class="text-xs text-text-muted">Week 34 · Day 232</span>
                </div>
                <div class="flex items-center gap-1.5 text-text-secondary">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-sm font-mono font-medium">10:30 AM</span>
                </div>
            </div>
            <!-- CENTER: Family Pills -->
            <div class="flex items-center gap-2">
                <div class="inline-flex items-center gap-1.5 rounded-full bg-faiyaz/10 px-2 py-1 text-xs font-medium text-faiyaz inset-ring inset-ring-faiyaz/20">
                    <div class="w-4 h-4 rounded-full bg-faiyaz flex items-center justify-center text-white text-[9px] font-bold leading-none">F</div>
                    <span>3</span>
                </div>
                <div class="inline-flex items-center gap-1.5 rounded-full bg-trisha/10 px-2 py-1 text-xs font-medium text-trisha inset-ring inset-ring-trisha/20">
                    <div class="w-4 h-4 rounded-full bg-trisha flex items-center justify-center text-white text-[9px] font-bold leading-none">T</div>
                    <span>2</span>
                </div>
                <div class="inline-flex items-center gap-1.5 rounded-full bg-arya/10 px-2 py-1 text-xs font-medium text-arya inset-ring inset-ring-arya/20">
                    <div class="w-4 h-4 rounded-full bg-arya flex items-center justify-center text-white text-[9px] font-bold leading-none">A</div>
                    <span>1</span>
                </div>
                <div class="inline-flex items-center gap-1.5 rounded-full bg-raya/10 px-2 py-1 text-xs font-medium text-raya inset-ring inset-ring-raya/20 opacity-50">
                    <div class="w-4 h-4 rounded-full bg-raya flex items-center justify-center text-white text-[9px] font-bold leading-none">R</div>
                    <span>0</span>
                </div>
                <div class="ml-1 inline-flex items-center rounded-full bg-primary-light px-2 py-1 text-xs font-medium text-primary inset-ring inset-ring-primary/20">
                    6 events
                </div>
            </div>
            <!-- RIGHT: View Switcher + Today + Date Picker Trigger -->
            <div class="flex items-center gap-3">
                <div class="flex items-center bg-bg-hover rounded-lg p-0.5">
                    <button class="px-3 py-1.5 text-xs font-medium text-text-muted hover:text-text-primary rounded-md transition-colors">Day</button>
                    <button class="px-3 py-1.5 text-xs font-medium bg-white text-primary shadow-view-btn rounded-md">Week</button>
                    <button class="px-3 py-1.5 text-xs font-medium text-text-muted hover:text-text-primary rounded-md transition-colors">Month</button>
                    <button class="px-3 py-1.5 text-xs font-medium text-text-muted hover:text-text-primary rounded-md transition-colors">Year</button>
                </div>
                <button class="px-3 py-1.5 text-xs font-medium text-text-primary border border-border rounded-lg hover:bg-bg-hover transition-colors">
                    Today
                </button>
                <!-- Date picker trigger — active state shown -->
                <button id="date-picker-trigger" class="p-1.5 text-primary bg-primary-light rounded-lg transition-colors" title="Date picker" onclick="togglePicker()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- DATE PICKER DROPDOWN — positioned below the calendar icon in header -->
    <div id="date-picker" class="absolute top-16 right-4 z-40 w-72 bg-white rounded-xl shadow-lg ring-1 ring-border overflow-hidden">

        <!-- Month/Year Navigation -->
        <div class="flex items-center justify-between px-3 pt-3 pb-2">
            <div class="flex items-center gap-0.5">
                <button onclick="changeYear(-1)" class="p-1 text-text-muted hover:text-text-primary hover:bg-bg-hover rounded-md transition-colors" title="Previous year">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 17l-5-5 5-5M12 17l-5-5 5-5"/>
                    </svg>
                </button>
                <button onclick="changeMonth(-1)" class="p-1 text-text-muted hover:text-text-primary hover:bg-bg-hover rounded-md transition-colors" title="Previous month">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
            <div class="flex items-center gap-1">
                <!-- Month selector -->
                <button id="month-label" class="text-sm font-semibold text-text-primary hover:bg-bg-hover rounded px-1.5 py-0.5 transition-colors">
                    August
                </button>
                <!-- Year selector -->
                <button id="year-label" class="text-sm font-semibold text-text-primary hover:bg-bg-hover rounded px-1.5 py-0.5 transition-colors">
                    2026
                </button>
            </div>
            <div class="flex items-center gap-0.5">
                <button onclick="changeMonth(1)" class="p-1 text-text-muted hover:text-text-primary hover:bg-bg-hover rounded-md transition-colors" title="Next month">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <button onclick="changeYear(1)" class="p-1 text-text-muted hover:text-text-primary hover:bg-bg-hover rounded-md transition-colors" title="Next year">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 7l5 5-5 5M12 7l5 5-5 5"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Day-of-week labels (ISO 8601: Monday first) -->
        <div class="grid grid-cols-7 px-2 pb-1">
            <div class="text-center text-[10px] font-medium text-text-faint py-1">Mo</div>
            <div class="text-center text-[10px] font-medium text-text-faint py-1">Tu</div>
            <div class="text-center text-[10px] font-medium text-text-faint py-1">We</div>
            <div class="text-center text-[10px] font-medium text-text-faint py-1">Th</div>
            <div class="text-center text-[10px] font-medium text-text-faint py-1">Fr</div>
            <div class="text-center text-[10px] font-medium text-text-faint py-1">Sa</div>
            <div class="text-center text-[10px] font-medium text-text-faint py-1">Su</div>
        </div>

        <!-- Calendar grid -->
        <div id="calendar-grid" class="grid grid-cols-7 px-2 pb-3 gap-y-0.5">
            <!-- Populated by JS -->
        </div>

        <!-- Footer: Today + Close -->
        <div class="flex items-center justify-between px-3 py-2 border-t border-border bg-bg/50">
            <button onclick="goToToday()" class="text-xs font-medium text-primary hover:text-primary-hover transition-colors">
                Today
            </button>
            <button onclick="togglePicker()" class="text-xs text-text-muted hover:text-text-primary transition-colors">
                Close
            </button>
        </div>
    </div>

    <!-- Content area placeholder -->
    <main class="h-full w-full flex flex-col p-2 pt-20 bg-bg">
        <div class="grow rounded-lg bg-white shadow-xs ring-1 ring-border overflow-hidden flex flex-col items-center justify-center">
            <h1 class="text-xl font-semibold text-text-primary mb-1">Date Picker — Mockup #12</h1>
            <p class="text-sm text-text-muted">Calendar grid · Month navigation · Today highlight · Selected date</p>
            <p class="text-xs text-text-faint mt-3">Click the calendar icon (top-right) to toggle. Use arrows to navigate months.</p>
        </div>
    </main>

    <script>
        // Theme toggle
        let currentTheme = 'auto';
        function toggleTheme() {
            const themes = ['auto', 'light', 'dark'];
            const currentIndex = themes.indexOf(currentTheme);
            currentTheme = themes[(currentIndex + 1) % themes.length];
            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');
            const iconAuto = document.getElementById('icon-auto');
            iconSun.classList.add('hidden');
            iconMoon.classList.add('hidden');
            iconAuto.classList.add('hidden');
            if (currentTheme === 'light') {
                html.classList.remove('dark');
                iconSun.classList.remove('hidden');
            } else if (currentTheme === 'dark') {
                html.classList.add('dark');
                iconMoon.classList.remove('hidden');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
                iconAuto.classList.remove('hidden');
            }
        }

        // Date picker state
        const today = new Date();
        let viewYear = today.getFullYear();
        let viewMonth = today.getMonth();
        let selectedDate = new Date(today);
        let pickerOpen = true; // Start open for mockup visibility

        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'];

        function togglePicker() {
            pickerOpen = !pickerOpen;
            document.getElementById('date-picker').classList.toggle('hidden', !pickerOpen);
            const trigger = document.getElementById('date-picker-trigger');
            if (pickerOpen) {
                trigger.classList.add('text-primary', 'bg-primary-light');
                trigger.classList.remove('text-text-secondary', 'hover:text-text-primary', 'hover:bg-bg-hover');
            } else {
                trigger.classList.remove('text-primary', 'bg-primary-light');
                trigger.classList.add('text-text-secondary', 'hover:text-text-primary', 'hover:bg-bg-hover');
            }
        }

        function changeMonth(delta) {
            viewMonth += delta;
            if (viewMonth < 0) { viewMonth = 11; viewYear--; }
            if (viewMonth > 11) { viewMonth = 0; viewYear++; }
            renderCalendar();
        }

        function changeYear(delta) {
            viewYear += delta;
            renderCalendar();
        }

        function goToToday() {
            viewYear = today.getFullYear();
            viewMonth = today.getMonth();
            selectedDate = new Date(today);
            renderCalendar();
        }

        function selectDate(day) {
            selectedDate = new Date(viewYear, viewMonth, day);
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('month-label').textContent = monthNames[viewMonth];
            document.getElementById('year-label').textContent = viewYear;

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // ISO 8601: Monday = 0, Sunday = 6
            const jsDay = new Date(viewYear, viewMonth, 1).getDay();
            const firstDay = (jsDay + 6) % 7; // Convert JS (Sun=0) to ISO (Mon=0)
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

            // Previous month trailing days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const cell = document.createElement('button');
                cell.className = 'w-8 h-8 text-xs text-text-disabled hover:bg-bg-hover rounded-md transition-colors';
                cell.textContent = day;
                grid.appendChild(cell);
            }

            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('button');
                const isToday = day === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear();
                const isSelected = day === selectedDate.getDate() && viewMonth === selectedDate.getMonth() && viewYear === selectedDate.getFullYear();

                let classes = 'w-8 h-8 text-xs rounded-md transition-colors relative ';

                if (isSelected) {
                    classes += 'bg-primary text-white font-semibold hover:bg-primary-hover';
                } else if (isToday) {
                    classes += 'bg-primary-light text-primary font-semibold hover:bg-primary-light-hover ring-1 ring-primary-ring';
                } else {
                    classes += 'text-text-primary hover:bg-bg-hover';
                }

                cell.className = classes;
                cell.textContent = day;
                cell.onclick = () => selectDate(day);
                grid.appendChild(cell);
            }

            // Next month leading days
            const totalCells = firstDay + daysInMonth;
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= remaining; day++) {
                const cell = document.createElement('button');
                cell.className = 'w-8 h-8 text-xs text-text-disabled hover:bg-bg-hover rounded-md transition-colors';
                cell.textContent = day;
                grid.appendChild(cell);
            }
        }

        // Initial render
        renderCalendar();
    </script>
</body>
</html>
