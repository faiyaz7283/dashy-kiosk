<!DOCTYPE html>
<!--
  ️ KIOSK-V2 MOCKUP — TAILWIND ONLY RULE ️

  This mockup uses ONLY Tailwind utility classes. No inline styles with var(--dt-*).
  When implementing in React:
  - All styling must use Tailwind utility classes (bg-bg, text-text-primary, etc.)
  - No inline style="..." with CSS custom properties
  - No const styles objects
  - No CSS Modules or styled-components
  - Dark mode via Tailwind's `dark:` variant (`.dark` class on <html>)
  - Design tokens consumed via @theme block in src/index.css
  See AGENTS.md section 5b for full rules.

  NOTE: This mockup uses JavaScript to generate time slots dynamically.
  A hidden sentinel div ensures Tailwind CDN generates CSS for all dynamic classes.
  In React implementation, use JSX (not JS DOM manipulation) so Tailwind classes are always present.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashy v2 — Calendar Day View</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', system-ui, sans-serif;
            --color-primary: var(--dt-primary);
            --color-primary-hover: var(--dt-primary-hover);
            --color-primary-light: var(--dt-primary-light);
            --color-primary-light-hover: var(--dt-primary-light-hover);
            --color-primary-ring: var(--dt-primary-ring);
            --color-bg: var(--dt-bg);
            --color-bg-hover: var(--dt-bg-hover);
            --color-white: var(--dt-white);
            --color-text-primary: var(--dt-text-primary);
            --color-text-secondary: var(--dt-text-secondary);
            --color-text-muted: var(--dt-text-muted);
            --color-text-faint: var(--dt-text-faint);
            --color-text-disabled: var(--dt-text-disabled);
            --color-border: var(--dt-border);
            --color-border-light: var(--dt-border-light);
            --color-border-dark: var(--dt-border-dark);
            --color-faiyaz: var(--dt-member-faiyaz);
            --color-trisha: var(--dt-member-trisha);
            --color-arya: var(--dt-member-arya);
            --color-raya: var(--dt-member-raya);
        }

        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="tokens.css">
    <style>
        /* Current time marker */
        .current-time-marker {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #ef4444;
            z-index: 10;
        }
        .current-time-marker::before {
            content: '';
            position: absolute;
            left: -5px;
            top: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
        }
    </style>
</head>
<body class="bg-bg text-text-primary font-sans h-screen overflow-hidden">

    <!-- Theme toggle (bottom-right) -->
    <button id="theme-toggle" class="fixed bottom-4 right-4 z-[9999] p-2 bg-white text-text-secondary border border-border rounded-lg cursor-pointer hover:bg-bg-hover hover:text-text-primary"
            onclick="toggleTheme()"
            title="Toggle theme">
        <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="icon-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg id="icon-auto" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
    </button>

    <!-- Navigation arrows (fixed, overlay content area, transparent until hover) -->
    <button class="fixed left-2 top-1/2 -translate-y-1/2 z-50 p-2 rounded-full bg-white/10 hover:bg-white border border-transparent hover:border-border text-text-faint/10 hover:text-text-primary transition-all cursor-pointer"
            title="Previous day">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
    </button>
    <button class="fixed right-2 top-1/2 -translate-y-1/2 z-50 p-2 rounded-full bg-white/10 hover:bg-white border border-transparent hover:border-border text-text-faint/10 hover:text-text-primary transition-all cursor-pointer"
            title="Next day">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
    </button>

    <!-- Hidden sentinel: ensures Tailwind CDN generates CSS for all dynamically-used classes -->
    <div class="hidden border-border bg-white dark:bg-bg bg-bg-hover text-text-primary text-text-muted text-text-faint border-faiyaz border-trisha border-arya border-raya bg-faiyaz/10 bg-trisha/10 bg-arya/10 bg-raya/10 hover:bg-faiyaz/20 hover:bg-trisha/20 hover:bg-arya/20 hover:bg-raya/20 border-l-4 rounded-md"></div>

    <!-- DAY VIEW CONTENT — Full viewport -->
    <main class="h-full w-full flex flex-col p-2 bg-bg">
        <!-- Content card (Catalyst pattern) -->
        <div class="grow rounded-lg bg-white shadow-xs ring-1 ring-border overflow-hidden flex flex-col">

            <!-- Weather + All-day events (sticky at top) -->
            <div class="sticky top-0 z-10 bg-white border-b border-border">
                <!-- Weather bar -->
                <div class="px-4 py-2 border-b border-border-light">
                    <div class="flex items-center gap-3">
                        <svg class="w-6 h-6 text-warning" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
                        </svg>
                        <div class="flex items-baseline gap-2">
                            <span class="text-xl font-bold text-text-primary">83°</span>
                            <span class="text-sm text-text-muted">68°</span>
                        </div>
                        <span class="text-sm text-text-muted">clear</span>
                        <div class="flex items-center gap-3 text-xs text-text-faint">
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                                </svg>
                                55%
                            </span>
                            <span class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                                </svg>
                                4 mph
                            </span>
                        </div>
                    </div>
                </div>

                <!-- All-day events -->
                <div class="px-4 py-2">
                    <div class="text-xs font-semibold text-text-muted uppercase tracking-wide mb-1">All-day</div>
                    <div class="space-y-1">
                        <div class="bg-raya/10 border-l-4 border-raya rounded-md px-3 py-1.5 hover:bg-raya/20 transition-colors cursor-pointer">
                            <div class="flex items-center justify-between">
                                <span class="text-sm font-medium text-text-primary">Family Reunion</span>
                                <div class="w-5 h-5 rounded-full bg-raya flex items-center justify-center text-white text-[10px] font-bold leading-none">R</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Time grid (two-column: labels | content) -->
            <div class="flex-1 overflow-y-auto" id="time-grid-scroll">
                <div class="flex" id="time-grid">
                    <!-- Time labels column -->
                    <div class="w-20 flex-shrink-0 border-r border-border" id="time-labels"></div>
                    <!-- Content column -->
                    <div class="flex-1 relative" id="time-content">
                        <!-- Current time marker -->
                        <div class="current-time-marker" id="current-time-marker"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        let currentTheme = 'auto';
        const slotHeight = 60;

        // Generate 24-hour time grid
        const timeLabels = document.getElementById('time-labels');
        const timeContent = document.getElementById('time-content');

        for (let hour = 0; hour < 24; hour++) {
            const timeLabel = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;

            // Time label cell
            const labelCell = document.createElement('div');
            labelCell.className = 'flex items-start justify-end pr-3 pt-2 text-xs text-text-muted';
            labelCell.style.height = `${slotHeight}px`;
            labelCell.textContent = timeLabel;
            timeLabels.appendChild(labelCell);

            // Content row (with hover striping using Tailwind classes)
            const row = document.createElement('div');
            row.className = 'time-row border-b border-border bg-white dark:bg-bg hover:bg-bg-hover transition-colors';
            row.style.height = `${slotHeight}px`;
            timeContent.appendChild(row);
        }

        // Add events to content column
        const events = [
            { hour: 11, duration: 0.5, title: 'Team Standup', color: 'faiyaz', initial: 'F' },
            { hour: 13, duration: 1, title: 'Lunch with Sarah', color: 'trisha', initial: 'T' },
            { hour: 15, duration: 2, title: 'Soccer Practice', color: 'arya', initial: 'A' },
        ];

        events.forEach(event => {
            const topOffset = event.hour * slotHeight;
            const height = event.duration * slotHeight;
            const isSmall = event.duration < 1;

            const eventCard = document.createElement('div');
            eventCard.className = `absolute left-2 right-2 bg-${event.color}/10 border-l-4 border-${event.color} rounded-md hover:bg-${event.color}/20 transition-colors cursor-pointer overflow-hidden`;
            eventCard.style.top = `${topOffset + 2}px`;
            eventCard.style.height = `${height - 4}px`;

            if (isSmall) {
                // Compact layout for sub-hour events
                eventCard.innerHTML = `
                    <div class="flex items-center justify-between h-full px-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="text-xs font-medium text-text-primary truncate">${event.title}</span>
                        </div>
                        <div class="w-4 h-4 rounded-full bg-${event.color} flex items-center justify-center text-white text-[8px] font-bold leading-none flex-shrink-0">${event.initial}</div>
                    </div>
                `;
            } else {
                // Full layout for 1+ hour events
                eventCard.innerHTML = `
                    <div class="flex items-start justify-between h-full px-2 py-1">
                        <div class="min-w-0">
                            <div class="text-sm font-medium text-text-primary">${event.title}</div>
                            <div class="text-xs text-text-muted mt-0.5">${formatTime(event.hour)} - ${formatTime(event.hour + event.duration)}</div>
                        </div>
                        <div class="w-5 h-5 rounded-full bg-${event.color} flex items-center justify-center text-white text-[10px] font-bold leading-none flex-shrink-0">${event.initial}</div>
                    </div>
                `;
            }

            timeContent.appendChild(eventCard);
        });

        // Position current time marker (2:45 PM = 14.75 hours)
        const currentTimeHours = 14.75;
        const markerTop = currentTimeHours * slotHeight;
        document.getElementById('current-time-marker').style.top = `${markerTop}px`;

        // Autoscroll to current time
        const scrollToPosition = markerTop - 100;
        document.getElementById('time-grid-scroll').scrollTop = scrollToPosition;

        function formatTime(decimalHour) {
            const hours = Math.floor(decimalHour);
            const minutes = Math.round((decimalHour % 1) * 60);
            const period = hours < 12 ? 'AM' : 'PM';
            const displayHour = hours === 0 ? 12 : hours > 12 ? hours - 12 : hours;
            return `${displayHour}:${minutes.toString().padStart(2, '0')} ${period}`;
        }

        function toggleTheme() {
            const themes = ['auto', 'light', 'dark'];
            const currentIndex = themes.indexOf(currentTheme);
            currentTheme = themes[(currentIndex + 1) % themes.length];

            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');
            const iconAuto = document.getElementById('icon-auto');

            iconSun.classList.add('hidden');
            iconMoon.classList.add('hidden');
            iconAuto.classList.add('hidden');

            if (currentTheme === 'light') {
                html.classList.remove('dark');
                iconSun.classList.remove('hidden');
            } else if (currentTheme === 'dark') {
                html.classList.add('dark');
                iconMoon.classList.remove('hidden');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
                iconAuto.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
