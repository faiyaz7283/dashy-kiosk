<!DOCTYPE html>
<!--
  ⚠️ KIOSK-V2 MOCKUP — TAILWIND ONLY RULE ️

  This mockup uses ONLY Tailwind utility classes. No inline styles with var(--dt-*).
  When implementing in React:
  - All styling must use Tailwind utility classes (bg-bg, text-text-primary, etc.)
  - No inline style="..." with CSS custom properties
  - No const styles objects
  - No CSS Modules or styled-components
  - Dark mode via Tailwind's `dark:` variant (`.dark` class on <html>)
  - Design tokens consumed via @theme block in src/index.css
  See AGENTS.md section 5b for full rules.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashy v2 — Sidebar Detail</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', system-ui, sans-serif;
            --color-primary: var(--dt-primary);
            --color-primary-hover: var(--dt-primary-hover);
            --color-primary-light: var(--dt-primary-light);
            --color-primary-light-hover: var(--dt-primary-light-hover);
            --color-primary-ring: var(--dt-primary-ring);
            --color-bg: var(--dt-bg);
            --color-bg-hover: var(--dt-bg-hover);
            --color-white: var(--dt-white);
            --color-text-primary: var(--dt-text-primary);
            --color-text-secondary: var(--dt-text-secondary);
            --color-text-muted: var(--dt-text-muted);
            --color-text-faint: var(--dt-text-faint);
            --color-text-disabled: var(--dt-text-disabled);
            --color-border: var(--dt-border);
            --color-border-light: var(--dt-border-light);
            --color-border-dark: var(--dt-border-dark);
            --color-faiyaz: var(--dt-member-faiyaz);
            --color-trisha: var(--dt-member-trisha);
            --color-arya: var(--dt-member-arya);
            --color-raya: var(--dt-member-raya);
            --shadow-sidebar: var(--dt-shadow-sidebar);
        }

        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="stylesheet" href="tokens.css">
    <style>
        .sidebar-transition {
            transition: width 0.3s ease;
        }
        .sidebar-label {
            transition: opacity 0.2s ease;
        }
        .sidebar-action {
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body class="bg-bg text-text-primary font-sans h-screen overflow-hidden flex">

    <!-- Theme toggle (bottom-right) -->
    <button id="theme-toggle" class="fixed bottom-4 right-4 z-[9999] p-2 bg-white text-text-secondary border border-border rounded-lg cursor-pointer hover:bg-bg-hover hover:text-text-primary"
            onclick="toggleTheme()"
            title="Toggle theme">
        <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="icon-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg id="icon-auto" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
    </button>

    <!-- SIDEBAR — always visible for mockup review (no auto-hide) -->
    <aside id="sidebar" class="sidebar-transition absolute left-0 top-0 bottom-0 z-40 bg-white border-r border-border shadow-sidebar w-16 flex flex-col">

        <!-- Nav items container -->
        <nav class="relative flex flex-1 flex-col pt-4">
            <ul class="flex flex-1 flex-col gap-y-1 px-2">

                <!-- Calendar (active) -->
                <li>
                    <button class="group flex gap-x-3 rounded-md p-2 text-sm/6 font-semibold bg-primary-light text-primary w-full items-center">
                        <!-- Calendar icon -->
                        <svg class="size-6 shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <!-- Label (hidden when collapsed) -->
                        <span class="sidebar-label opacity-0 whitespace-nowrap">Calendar</span>
                        <!-- Refresh action (hidden when collapsed) -->
                        <svg class="sidebar-action size-4 shrink-0 opacity-0 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                </li>

                <!-- Chores (inactive) -->
                <li>
                    <button class="group flex gap-x-3 rounded-md p-2 text-sm/6 font-semibold text-text-secondary hover:bg-primary-light hover:text-primary w-full items-center transition-colors">
                        <!-- Checklist icon -->
                        <svg class="size-6 shrink-0 text-text-muted group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <!-- Label (hidden when collapsed) -->
                        <span class="sidebar-label opacity-0 whitespace-nowrap">Chores</span>
                        <!-- Add action (hidden when collapsed) -->
                        <svg class="sidebar-action size-4 shrink-0 opacity-0 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                    </button>
                </li>

            </ul>
        </nav>

        <!-- Expand/Collapse toggle (floating on right edge) -->
        <button id="sidebar-toggle" class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 p-1 bg-white border border-border rounded-full shadow-md hover:bg-bg-hover"
                onclick="toggleSidebar()"
                title="Toggle sidebar">
            <svg id="sidebar-toggle-icon" class="w-4 h-4 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>
    </aside>

    <!-- Content area placeholder (standardized content card pattern) -->
    <main class="flex-1 flex flex-col p-2 bg-bg">
        <div class="grow rounded-lg bg-white shadow-xs ring-1 ring-border overflow-hidden flex flex-col items-center justify-center">
            <h1 class="text-xl font-semibold text-text-primary mb-1">Sidebar — Mockup #3</h1>
            <p class="text-sm text-text-muted">Tailwind UI nav pattern · Calendar (refresh) · Chores (add)</p>
            <p class="text-xs text-text-faint mt-3">Click the arrow on the sidebar edge to toggle. Hover items to see color change.</p>
        </div>
    </main>

    <script>
        let sidebarExpanded = false;
        let currentTheme = 'auto';

        const sidebar = document.getElementById('sidebar');
        const sidebarLabels = document.querySelectorAll('.sidebar-label');
        const sidebarActions = document.querySelectorAll('.sidebar-action');
        const sidebarToggleIcon = document.getElementById('sidebar-toggle-icon');

        function toggleSidebar() {
            sidebarExpanded = !sidebarExpanded;
            updateSidebarState();
        }

        function updateSidebarState() {
            if (sidebarExpanded) {
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-56');
                sidebarLabels.forEach(el => el.classList.remove('opacity-0'));
                sidebarActions.forEach(el => el.classList.remove('opacity-0'));
                sidebarToggleIcon.style.transform = 'rotate(180deg)';
            } else {
                sidebar.classList.remove('w-56');
                sidebar.classList.add('w-16');
                sidebarLabels.forEach(el => el.classList.add('opacity-0'));
                sidebarActions.forEach(el => el.classList.add('opacity-0'));
                sidebarToggleIcon.style.transform = 'rotate(0deg)';
            }
        }

        function toggleTheme() {
            const themes = ['auto', 'light', 'dark'];
            const currentIndex = themes.indexOf(currentTheme);
            currentTheme = themes[(currentIndex + 1) % themes.length];

            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');
            const iconAuto = document.getElementById('icon-auto');

            iconSun.classList.add('hidden');
            iconMoon.classList.add('hidden');
            iconAuto.classList.add('hidden');

            if (currentTheme === 'light') {
                html.classList.remove('dark');
                iconSun.classList.remove('hidden');
            } else if (currentTheme === 'dark') {
                html.classList.add('dark');
                iconMoon.classList.remove('hidden');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
                iconAuto.classList.remove('hidden');
            }
        }

        // Initialize
        updateSidebarState();
    </script>
</body>
</html>
